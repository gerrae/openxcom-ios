name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MeridianOXC/openxcom-ios
          ref: oxce-plus
          submodules: recursive

      - name: Diagnostic - List directory structure
        continue-on-error: true
        run: |
          echo "=== Contents of Sources/OpenXcom/xcode-ios ==="
          ls -la Sources/OpenXcom/xcode-ios/ || echo "Directory not found"
          echo ""
          echo "=== Find all .xcodeproj and .xcworkspace ==="
          find Sources/OpenXcom -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) || echo "None found"
          echo ""
          echo "=== List directory tree ==="
          ls -la Sources/OpenXcom/ || echo "Sources/OpenXcom not found"

      - name: Diagnostic - List schemes from project
        continue-on-error: true
        run: |
          echo "=== Attempting to list schemes ==="
          xcodebuild -list -project Sources/OpenXcom/xcode-ios/OpenXcom.xcodeproj || echo "Project list failed"
          echo "List attempt completed"

      - name: Diagnostic - List schemes from workspace
        continue-on-error: true
        run: |
          echo "=== Attempting to list schemes from workspace ==="
          xcodebuild -list -workspace Sources/OpenXcom/xcode-ios/OpenXcom.xcworkspace || echo "Workspace list failed"
          echo "Workspace list attempt completed"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Sources/OpenXcom/xcode-ios/OpenXcom.xcodeproj \
            -scheme OpenXcom \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/OpenXcom.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP=$(find build/OpenXcom.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          cp -R "$APP" build/Payload/
          cd build && zip -r OpenXcom-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: openxcom-unsigned-ipa
          path: build/OpenXcom-unsigned.ipa
