name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MeridianOXC/openxcom-ios
          ref: oxce-plus
          submodules: recursive

      - name: List targets and schemes (diagnostic only)
        continue-on-error: true
        run: |
          echo "=== Listing targets ==="
          xcodebuild -list -project Sources/OpenXcom/xcode-ios/OpenXcom.xcodeproj 2>&1 | tee xcode-list.txt || true
          echo ""
          echo "=== Extracted targets ==="
          grep -E "Targets:|^\s+-" xcode-list.txt || echo "No targets found in output"

      - name: Build unsigned archive using target
        run: |
          xcodebuild archive \
            -project Sources/OpenXcom/xcode-ios/OpenXcom.xcodeproj \
            -target OpenXcom \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/OpenXcom.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP=$(find build/OpenXcom.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No .app found in archive"
            ls -la build/OpenXcom.xcarchive/Products/Applications/
            exit 1
          fi
          cp -R "$APP" build/Payload/
          cd build && zip -r OpenXcom-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: openxcom-unsigned-ipa
          path: build/OpenXcom-unsigned.ipa
